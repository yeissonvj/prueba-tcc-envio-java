# Actualizaciones semanales agrupadas: pocos PR, fáciles de revisar, siempre pasando por el pipeline.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*"] }
      pruebas: { patterns: ["org.testcontainers*", "com.tngtech.archunit*", "org.junit*", "org.assertj*"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
