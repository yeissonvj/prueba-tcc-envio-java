# Desarrollo local contra la infraestructura de infra/docker-compose.yml (solo secretos locales).
# Esperas cortas para ver la escalera de reintentos sin esperar una hora.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/tcc_eventos
    username: tcc
    password: tcc_local

kafka:
  servidores: localhost:29092,localhost:29093,localhost:29094

notificador:
  reintentos:
    - topico: notificaciones.reintento.1m
      espera: 5s
    - topico: notificaciones.reintento.10m
      espera: 10s
    - topico: notificaciones.reintento.1h
      espera: 15s
