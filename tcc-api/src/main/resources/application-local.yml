# Desarrollo local contra la infraestructura de infra/docker-compose.yml (solo secretos locales).
# Documentación interactiva: http://localhost:5013/swagger-ui.html
server:
  port: 5013

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/tcc_eventos
    username: tcc
    password: tcc_local
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: tcc_local

kafka:
  servidores: localhost:29092,localhost:29093,localhost:29094

seguridad:
  emisor: http://localhost:8081/realms/tcc

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
